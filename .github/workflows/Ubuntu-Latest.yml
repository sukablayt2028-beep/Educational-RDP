name: RDP Setup (Educational - Do Not Use)

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Install Desktop Environment
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies xrdp
          
      - name: Configure RDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          # The actual user is 'runner', not 'github-runner'
          echo "runner:YourPassword123" | sudo chpasswd
          sudo usermod -aG sudo runner
          
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          
      - name: Connect to Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-actions-rdp
          
      - name: Display Connection Info
        run: |
          echo "=========================================="
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Username: runner"
          echo "Password: YourPassword123"
          echo "=========================================="
          
      - name: Keep workflow alive
        run: |
          echo "VM will remain active for 6 hours (GitHub's max)"
          sleep 21600
